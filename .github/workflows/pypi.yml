name: Publish to PyPI

# Builds the client package and publishes it to PyPI.
#
# One-time setup on the PyPI side: create the "html-previewer" project and
# configure Trusted Publishing for this repository (environment "pypi",
# workflow path .github/workflows/pypi.yml). See:
# https://docs.pypi.org/trusted-publishers/
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build client
      - run: twine check client/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: client/dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
