<head>

<title>404 Not Found</title>
<style>
  :root { color-scheme: light dark; }
  html,body { height:100%; margin:0; }

    display:flex; align-items:center; justify-content:center;

    background:#0b0d10; color:#e6e8eb;
  }
  .card { text-align:center; padding:48px 40px; }
  .code { font-size:72px; font-weight:800; letter-spacing:2px; margin:0; color:#5b9dff; }
  .msg  { font-size:18px; margin:12px 0 4px; }
  .sub  { font-size:14px; opacity:.6; margin:0; }
</style>
</head>
<body>
  <div class="card">
    <p class="code">404</p>
    <p class="msg">This preview link is invalid or has expired.</p>
