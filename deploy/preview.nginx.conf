# Preview hosting vhost (generic template).
# install-system.sh renders __SERVER_NAME__ -> your domain and installs this as
#   /etc/nginx/sites-available/preview.<domain>.conf
#
# Capability-URL model: /{hash}/{topic}/index.html  (hash = unguessable token).
# Any wrong/expired path -> custom 404.  Does NOT touch other vhosts.
#
# Installed HTTP-only. Run `certbot --nginx -d <domain>` afterwards; certbot
# rewrites this server block for 443 and adds the 80->443 redirect.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root /var/www/preview/live;
    index index.html;

    # Allow ACME http-01 challenges (certbot) even before TLS exists.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/preview/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    # --- Upload / management API (reserved prefix, proxied to local service) ---
    location ^~ /_api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 300m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Custom 404 for every wrong / expired content link ---
    # Map 403 (indexless dir, root, denied dotfile) to the same 404 page so any
    # bad link looks identically "not found" and nothing leaks existence.
    error_page 403 =404 /__notfound.html;
    error_page 404 /__notfound.html;
    location = /__notfound.html {
        root /var/www/preview/static;
        internal;
    }

    # --- Static preview serving ---
    location / {
        autoindex off;
        try_files $uri $uri/ =404;
    }

    # Never serve hidden/dotfiles inside uploaded content.
    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/preview.access.log;
    error_log  /var/log/nginx/preview.error.log;
}
